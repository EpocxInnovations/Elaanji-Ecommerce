services:
  - type: web
    name: elaanji-api
    runtime: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elaanji-db
          property: connectionURI
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://elaanji-website.vercel.app
      - key: ENVIRONMENT
        value: production

databases:
  - name: elaanji-db
    plan: free
